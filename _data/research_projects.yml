{
  "novel-view-synthesis":
    {
      "title": "Novel view synthesis at scale",
      "venue": "ICCV",
      "year": 2025,
      "slides": ["google-nvs-1", "google-nvs-2", "google-nvs-3", "google-nvs-4", "google-nvs-5"],
      "image_alt": "CAT3D generates training views, and Tok-D disentangles source and target tokens",
      "description": "Token disentanglement lets transformer models learn from diffusion-generated views and generalize to unseen scenes.",
      "paper_title": "Scaling Transformer-Based Novel View Synthesis with Token Disentanglement and Synthetic Data",
      "contributions":
        [
          "Introduced source/target token disentanglement to reduce the effect of synthetic-view artifacts.",
          "Improved PSNR over LVSM by 1.13 dB on RealEstate10K and 1.64 dB on DL3DV in the published in-distribution, real-data comparison.",
          "Co-first author. The reported experiments use eight H100 GPUs.",
        ],
      "links":
        [{ "label": "Project site", "url": "https://scaling3dnvs.github.io/" }, { "label": "Paper", "url": "https://arxiv.org/abs/2509.06950" }],
      "image": "/assets/img/research-projects/novel-view-synthesis.webp",
      "pdf": "/assets/slides/novel-view-synthesis.pdf",
      "definition_title": "Token disentanglement",
      "definition": "Tok-D is a transformer block for novel view synthesis that distinguishes source-image tokens from target-view tokens through layer-wise modulation. It addresses feature alignment that can make a reconstruction model sensitive to artifacts in synthetic views.",
      "definition_context": "The goal is to learn a model that reconstructs new camera views across scenes, without optimizing a separate representation for every test scene.",
      "method_steps":
        [
          "Generate additional camera-conditioned views with CAT3D, a pretrained multi-view diffusion model.",
          "Use separate modulation for source and target tokens to improve feature alignment when training with synthetic views.",
          "Train the view-synthesis transformer on real and generated observations, then evaluate reconstruction on both familiar and unseen scene distributions.",
        ],
      "results":
        [
          "In the published in-distribution comparison, Tok-D reaches 30.02 dB PSNR on RealEstate10K and 21.55 dB on DL3DV. These are gains of 1.13 dB and 1.64 dB over the reported LVSM baseline.",
          "A separate synthetic-data experiment shows small cross-dataset PSNR gains for Tok-D when generated views are added, while LVSM's PSNR decreases under the same augmentation setting.",
        ],
      "results_context": "The first comparison is Table 1 at 256 × 256 resolution with real-data training. Table 2 studies synthetic augmentation separately. The paper reports training our models on eight H100 GPUs for 100,000 iterations.",
      "source_url": "https://arxiv.org/abs/2509.06950",
      "company": "Google",
      "role": "Research Intern",
      "period": "Dec 2024 – Mar 2025",
      "navigation_group": "papers",
    },
  "gendeg":
    {
      "title": "GenDeg",
      "venue": "CVPR",
      "year": 2025,
      "slides": ["gendeg-1", "gendeg-2", "gendeg-3", "gendeg-4", "gendeg-5"],
      "image_alt": "Haze and rain restoration with PromptIR before and after training with GenDS",
      "description": "Diffusion-generated degradations improve restoration on patterns that the model has not seen during training.",
      "paper_title": "GenDeg: Diffusion-Based Degradation Synthesis for Generalizable All-in-One Image Restoration",
      "contributions":
        [
          "Developed degradation synthesis with control over degradation type and intensity.",
          "Generated 550K+ synthetic image pairs spanning six degradation types, contributing to GenDS with 750K+ samples.",
          "Improved the generalization of all-in-one restoration models to unseen degradation patterns.",
        ],
      "links":
        [
          { "label": "Project site", "url": "https://sudraj2002.github.io/gendegpage/" },
          {
            "label": "Paper",
            "url": "https://openaccess.thecvf.com/content/CVPR2025/html/Rajagopalan_GenDeg_Diffusion-based_Degradation_Synthesis_for_Generalizable_All-In-One_Image_Restoration_CVPR_2025_paper.html",
          },
        ],
      "image": "/assets/img/research-projects/gendeg.webp",
      "pdf": "/assets/slides/gendeg.pdf",
      "definition_title": "Controlled degradation synthesis",
      "definition": "GenDeg is a conditional diffusion model that turns clean images into realistically degraded images. Conditioning specifies both the degradation type and its intensity, so a single clean image can produce varied training examples for restoration.",
      "definition_context": "The clean input remains the restoration target. This creates paired training data without collecting a new real-world degraded/clean pair for every corruption pattern.",
      "method_steps":
        [
          "Condition degradation synthesis on a clean image, a degradation type and an intensity level.",
          "Generate paired examples across haze, rain, snow, motion blur, low light and raindrops.",
          "Combine the synthetic pairs with existing paired datasets to form GenDS, then train all-in-one restoration models on the expanded data.",
        ],
      "results":
        [
          "GenDeg contributes more than 550,000 synthetic image pairs across six degradation types. GenDS contains more than 750,000 samples after combining these with existing data.",
          "Restoration models trained with GenDS improve on out-of-distribution degradation patterns. The slide compares PromptIR with and without GenDS training on haze and rain examples.",
        ],
      "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Rajagopalan_GenDeg_Diffusion-based_Degradation_Synthesis_for_Generalizable_All-In-One_Image_Restoration_CVPR_2025_paper.html",
      "navigation_group": "papers",
    },
  "scale-wise-var":
    {
      "title": "Scale-Wise VAR",
      "venue": "arXiv preprint",
      "year": 2025,
      "slides": ["scale-wise-var-1", "scale-wise-var-2", "scale-wise-var-3", "scale-wise-var-4", "scale-wise-var-5"],
      "image_alt": "A Markovian attention mask connects scale-wise visual autoregression with discrete diffusion",
      "description": "A theoretical connection between scale-wise autoregressive generation and discrete diffusion motivates iterative visual refinement.",
      "paper_title": "Scale-Wise VAR is Secretly Discrete Diffusion",
      "contributions":
        [
          "Established an equivalence between scale-wise VAR and discrete diffusion under a Markovian attention mask.",
          "Used the connection to develop Scalable Visual Refinement with Discrete Diffusion (SRDD).",
          "Co-first author with Amandeep Kumar.",
        ],
      "links": [{ "label": "Paper", "url": "https://arxiv.org/abs/2509.22636" }],
      "image": "/assets/img/research-projects/scale-wise-var.webp",
      "pdf": "/assets/slides/scale-wise-var.pdf",
      "definition_title": "Scale-wise generation as discrete diffusion",
      "definition": "Scale-wise VAR generates visual tokens from coarse scales to finer scales. This work shows that, under a Markovian attention mask, its generation process is mathematically equivalent to a discrete diffusion process.",
      "definition_context": "The attention-mask condition is central to the equivalence. It provides a principled way to connect autoregressive token prediction with diffusion-style refinement.",
      "method_steps":
        [
          "Express next-scale prediction as a transition between discrete visual-token representations.",
          "Apply the Markovian attention mask and relate the resulting transitions and training objective to discrete diffusion.",
          "Use this interpretation in Scalable Visual Refinement with Discrete Diffusion (SRDD) to bring iterative refinement into the scale-wise generation framework.",
        ],
      "results":
        [
          "The main theoretical result is the equivalence under the specified attention mask.",
          "The preprint reports improvements in generation and efficiency, and demonstrates iterative refinement and zero-shot reconstruction through the diffusion interpretation.",
        ],
      "source_url": "https://arxiv.org/abs/2509.22636",
      "navigation_group": "papers",
    },
  "steered-diffusion":
    {
      "title": "Steered Diffusion",
      "venue": "ICCV",
      "year": 2023,
      "slides": ["steered-diffusion-1", "steered-diffusion-2", "steered-diffusion-3", "steered-diffusion-4", "steered-diffusion-5"],
      "image_alt": "Steered Diffusion examples for inpainting and semantic generation",
      "description": "A general framework steers pretrained diffusion models during sampling for image-to-image and label-conditioned generation.",
      "paper_title": "Steered Diffusion: A Generalized Framework for Plug-and-Play Conditional Image Synthesis",
      "contributions":
        [
          "Introduced the first plug-and-play framework applicable to both image-to-image translation and label-conditioned synthesis in the studied setting.",
          "Used pretrained auxiliary networks and energy-based guidance to express new conditions at inference time.",
          "Supported tasks including inpainting, colorization, super-resolution and semantic generation without task-specific generator training.",
        ],
      "links":
        [
          { "label": "Code", "url": "https://github.com/merlresearch/SteeredDiffusion" },
          {
            "label": "Paper",
            "url": "https://openaccess.thecvf.com/content/ICCV2023/html/Nair_Steered_Diffusion_A_Generalized_Framework_for_Plug-and-Play_Conditional_Image_Synthesis_ICCV_2023_paper.html",
          },
        ],
      "image": "/assets/img/research-projects/steered-diffusion.webp",
      "pdf": "/assets/slides/steered-diffusion.pdf",
      "definition_title": "Energy-based diffusion steering",
      "definition": "Steered Diffusion turns a pretrained diffusion generator into a conditional generator at inference time. A pretrained inverse model defines a loss for the requested condition, and that loss steers the denoising trajectory toward an image that satisfies it.",
      "definition_context": "For example, an inverse model can estimate a semantic label or a degraded observation from the current image. Comparing that prediction with the desired condition supplies a guidance signal.",
      "method_steps":
        [
          "Choose a pretrained diffusion generator and an auxiliary model that represents the desired task or condition.",
          "Construct a task loss that measures agreement with the input condition during sampling.",
          "Use the guidance signal to steer denoising, adapting the generator to the task without training a separate task-specific generator.",
        ],
      "results":
        [
          "The framework supports image-to-image and label-conditioned synthesis within the same plug-and-play formulation.",
          "The paper demonstrates tasks including inpainting, colorization, super-resolution and semantic generation. The slide shows inpainting and semantic-generation samples.",
        ],
      "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Nair_Steered_Diffusion_A_Generalized_Framework_for_Plug-and-Play_Conditional_Image_Synthesis_ICCV_2023_paper.html",
      "company": "MERL",
      "role": "Research Intern",
      "period": "May – Aug 2022",
      "navigation_group": "papers",
    },
  "unite-and-conquer":
    {
      "title": "Unite and Conquer",
      "venue": "CVPR",
      "year": 2023,
      "slides": ["unite-and-conquer-1", "unite-and-conquer-2", "unite-and-conquer-3", "unite-and-conquer-4", "unite-and-conquer-5"],
      "image_alt": "Unite and Conquer combines class labels and scene descriptions through independent diffusion models",
      "description": "Independently trained diffusion models compose at inference time to satisfy multiple conditions without joint multimodal training.",
      "paper_title": "Unite and Conquer: Plug & Play Multi-Modal Synthesis Using Diffusion Models",
      "contributions":
        [
          "Pioneered compositional multimodal generation by combining independent diffusion models through a generalized product of experts.",
          "Introduced controllable modality weights to balance the influence of different models.",
          "Demonstrated joint class-and-text constraints without training a new model for every modality combination.",
        ],
      "links":
        [
          {
            "label": "Paper",
            "url": "https://openaccess.thecvf.com/content/CVPR2023/papers/Nair_Unite_and_Conquer_Plug__Play_Multi-Modal_Synthesis_Using_Diffusion_CVPR_2023_paper.pdf",
          },
        ],
      "image": "/assets/img/research-projects/unite-and-conquer.webp",
      "pdf": "/assets/slides/unite-and-conquer.pdf",
      "definition_title": "Composing independent diffusion models",
      "definition": "Unite and Conquer combines independently trained, modality-conditioned diffusion models into a single sampling process. A generalized product of experts provides a way to combine their information without jointly training a new model on every modality combination.",
      "definition_context": "Each model contributes a conditional prediction. Reliability-weighted predictions with a null condition estimate the shared unconditional density used in the composition.",
      "method_steps":
        [
          "Select diffusion models trained for the individual conditions, such as an object class and a text description.",
          "Combine their conditional and null-condition predictions using the product-of-experts formulation and reliability weights.",
          "Sample one image with the combined guidance so the result can express the conditions together.",
        ],
      "results":
        [
          "The method demonstrates multimodal synthesis without joint multimodal training or retraining for each new combination of conditions.",
          "The slide pairs ImageNet classes with text-defined scenes. The composed samples retain the requested class while expressing scenes such as a starry night or a snowy forest.",
        ],
      "source_url": "https://openaccess.thecvf.com/content/CVPR2023/papers/Nair_Unite_and_Conquer_Plug__Play_Multi-Modal_Synthesis_Using_Diffusion_CVPR_2023_paper.pdf",
      "navigation_group": "papers",
    },
