  "crowddiff":
    {
      "title": "CrowdDiff",
      "venue": "CVPR",
      "year": 2024,
      "slides": ["crowddiff-1", "crowddiff-2", "crowddiff-3", "crowddiff-4", "crowddiff-5"],
      "image_alt": "CrowdDiff predicts detailed density maps and uses multiple hypotheses for crowd counting",
      "description": "Conditional diffusion predicts detailed crowd density maps, with multiple hypotheses to improve counting.",
      "paper_title": "CrowdDiff: Multi-hypothesis Crowd Density Estimation using Diffusion Models",
      "contributions":
        [
          "Applied conditional diffusion to crowd density estimation.",
          "Used a regression branch during training to improve feature learning.",
          "Combined multiple density-map hypotheses to improve counting under ambiguous visual conditions.",
        ],
      "links":
        [
          {
            "label": "Paper",
            "url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Ranasinghe_CrowdDiff_Multi-hypothesis_Crowd_Density_Estimation_using_Diffusion_Models_CVPR_2024_paper.pdf",
          },
        ],
      "image": "/assets/img/research-projects/crowddiff.webp",
      "pdf": "/assets/slides/crowddiff.pdf",
      "definition_title": "Multi-hypothesis density estimation",
      "definition": "CrowdDiff models a crowd density map as a conditional diffusion output. Repeated sampling produces multiple plausible maps, whose head-location estimates can be fused to improve counting.",
      "definition_context": "The method uses narrow density kernels to retain localized head structure. Its fusion procedure adds new head detections and rejects repeated locations across hypotheses.",
      "method_steps":
        [
          "Train an image-conditioned denoising model on noisy density maps made with narrow kernels. A regression branch supports feature learning during training.",
          "Sample multiple density-map hypotheses and convert them into crowd maps containing estimated head locations.",
          "Order the maps by structural similarity and fuse their detections, rejecting duplicate locations using a neighborhood-based radius. Count the resulting head locations.",
        ],
      "results":
        [
          "The paper evaluates diffusion-based density estimation and multi-hypothesis fusion for crowd counting.",
          "The displayed example has 1,155 people in the ground truth and a CrowdDiff estimate of 1,142. These are counts for one image, not an aggregate benchmark score.",
        ],
      "source_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Ranasinghe_CrowdDiff_Multi-hypothesis_Crowd_Density_Estimation_using_Diffusion_Models_CVPR_2024_paper.pdf",
      "navigation_group": "papers",
    },
  "control2control":
    {
      "title": "Control2Control",
      "venue": "Adobe research draft",
      "year": 2023,
      "slides": ["control2control-1", "control2control-2", "control2control-3", "control2control-4", "control2control-5"],
      "links": [],
      "introduction": "Training-free diffusion editing with sketches, poses or layouts.",
      "description": "Revitalized attention transfer blends target self-attention keys and values inside an edit mask with source keys and values outside it, supporting spatial edits while helping preserve the surrounding scene.",
      "paper_title": "Control2Control: Revitalizing Attention Transfer for Consistent Visual Editing",
      "definition_title": "Revitalized attention transfer",
      "definition": "Revitalized attention transfer is a mask-guided self-attention operation for diffusion image editing. At selected layers, it uses the target branch's keys and values within the edit region and the source branch's keys and values elsewhere.",
      "definition_context": "The target branch retains its own queries. This lets the edited object attend to the original scene while giving the changed region freedom to follow the new spatial condition.",
      "definition_mask": "M is the edit mask: 1 inside the changed region and 0 outside it. The subscripts t and s denote the target and source branches, respectively.",
      "contributions":
        [
          "Built a training-free diffusion pipeline for interactive edits using sketches, poses or layouts.",
          "Estimated edit masks from source/target self-attention differences using low-rank filtering.",
          "Used masked key/value transfer to support changes while retaining source content in unchanged regions.",
        ],
      "attention_transfer_equations": true,
      "method_steps":
        [
          "Run source and target diffusion branches with the original and user-edited spatial conditions.",
          "Accumulate self-attention features over intermediate denoising steps. Filter their source/target difference with a low-rank decomposition and threshold it to estimate the edit mask.",
          "Blend target keys and values inside the mask with source keys and values outside it at selected layers, then complete denoising.",
        ],
      "results":
        [
          "The working draft illustrates interactive edits with sketches, pose skeletons and object layouts using pretrained spatial controllers.",
          "Large changes in pose or scene semantics can also require an updated text prompt.",
        ],
      "company": "Adobe",
      "role": "Research Intern",
      "period": "May – Aug 2023",
      "industry_description": "Built a training-free diffusion editing pipeline, using revitalized attention transfer to apply spatial edits while preserving the surrounding scene.",
      "navigation_group": "internships",
      "presentation_status": "Research draft",
    },
