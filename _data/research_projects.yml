  "novel-view-synthesis":
    {
      "title": "Novel view synthesis at scale",
      "venue": "ICCV",
      "year": 2025,
      "slides": ["google-nvs-1", "google-nvs-2", "google-nvs-3", "google-nvs-4", "google-nvs-5"],
      "image_alt": "CAT3D generates training views, and Tok-D disentangles source and target tokens",
      "description": "Token disentanglement lets transformer models learn from diffusion-generated views and generalize to unseen scenes.",
      "paper_title": "Scaling Transformer-Based Novel View Synthesis with Token Disentanglement and Synthetic Data",
      "contributions":
        [
          "Introduced source/target token disentanglement to reduce the effect of synthetic-view artifacts.",
          "Improved PSNR over LVSM by 1.13 dB on RealEstate10K and 1.64 dB on DL3DV in the published in-distribution, real-data comparison.",
          "Co-first author. The reported experiments use eight H100 GPUs.",
        ],
      "links":
        [{ "label": "Project site", "url": "https://scaling3dnvs.github.io/" }, { "label": "Paper", "url": "https://arxiv.org/abs/2509.06950" }],
      "image": "/assets/img/research-projects/novel-view-synthesis.webp",
      "pdf": "/assets/slides/novel-view-synthesis.pdf",
      "definition_title": "Token disentanglement",
      "definition": "Tok-D is a transformer block for novel view synthesis that distinguishes source-image tokens from target-view tokens through layer-wise modulation. It addresses feature alignment that can make a reconstruction model sensitive to artifacts in synthetic views.",
      "definition_context": "The goal is to learn a model that reconstructs new camera views across scenes, without optimizing a separate representation for every test scene.",
      "method_steps":
        [
          "Generate additional camera-conditioned views with CAT3D, a pretrained multi-view diffusion model.",
          "Use separate modulation for source and target tokens to improve feature alignment when training with synthetic views.",
          "Train the view-synthesis transformer on real and generated observations, then evaluate reconstruction on both familiar and unseen scene distributions.",
        ],
      "results":
        [
          "In the published in-distribution comparison, Tok-D reaches 30.02 dB PSNR on RealEstate10K and 21.55 dB on DL3DV. These are gains of 1.13 dB and 1.64 dB over the reported LVSM baseline.",
          "A separate synthetic-data experiment shows small cross-dataset PSNR gains for Tok-D when generated views are added, while LVSM's PSNR decreases under the same augmentation setting.",
        ],
      "results_context": "The first comparison is Table 1 at 256 × 256 resolution with real-data training. Table 2 studies synthetic augmentation separately. The paper reports training our models on eight H100 GPUs for 100,000 iterations.",
      "source_url": "https://arxiv.org/abs/2509.06950",
      "company": "Google",
      "role": "Research Intern",
      "period": "Dec 2024 – Mar 2025",
      "navigation_group": "papers",
    },
  "gendeg":
    {
      "title": "GenDeg",
      "venue": "CVPR",
      "year": 2025,
      "slides": ["gendeg-1", "gendeg-2", "gendeg-3", "gendeg-4", "gendeg-5"],
      "image_alt": "Haze and rain restoration with PromptIR before and after training with GenDS",
      "description": "Diffusion-generated degradations improve restoration on patterns that the model has not seen during training.",
      "paper_title": "GenDeg: Diffusion-Based Degradation Synthesis for Generalizable All-in-One Image Restoration",
      "contributions":
        [
          "Developed degradation synthesis with control over degradation type and intensity.",
          "Generated 550K+ synthetic image pairs spanning six degradation types, contributing to GenDS with 750K+ samples.",
          "Improved the generalization of all-in-one restoration models to unseen degradation patterns.",
        ],
      "links":
        [
          { "label": "Project site", "url": "https://sudraj2002.github.io/gendegpage/" },
          {
            "label": "Paper",
            "url": "https://openaccess.thecvf.com/content/CVPR2025/html/Rajagopalan_GenDeg_Diffusion-based_Degradation_Synthesis_for_Generalizable_All-In-One_Image_Restoration_CVPR_2025_paper.html",
          },
        ],
      "image": "/assets/img/research-projects/gendeg.webp",
      "pdf": "/assets/slides/gendeg.pdf",
      "definition_title": "Controlled degradation synthesis",
      "definition": "GenDeg is a conditional diffusion model that turns clean images into realistically degraded images. Conditioning specifies both the degradation type and its intensity, so a single clean image can produce varied training examples for restoration.",
      "definition_context": "The clean input remains the restoration target. This creates paired training data without collecting a new real-world degraded/clean pair for every corruption pattern.",
      "method_steps":
        [
          "Condition the diffusion generator on a clean image, text and degradation statistics to control degradation type and intensity.",
          "Generate paired examples across six degradation types, apply structure correction and retain samples that meet the intensity criteria.",
          "Combine the 550K+ synthetic pairs with existing data to form GenDS with 750K+ samples, then train all-in-one restoration models.",
        ],
      "results":
        [
          "GenDS improves out-of-distribution restoration with the same Swin architecture. On O-Haze, LPIPS decreases from 0.254 to 0.165 and FID from 109.9 to 74.6 when existing-data training is replaced by GenDS training (Table 2).",
          "The results slide also reports LOLv1, RSVD and GoPro. Gains vary by degradation: on GoPro, LPIPS improves from 0.198 to 0.170, while FID increases from 31.7 to 36.2. Both metrics are lower-is-better.",
          "The qualitative comparison shows restoration examples with and without GenDS. GD denotes training with GenDS.",
        ],
      "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Rajagopalan_GenDeg_Diffusion-based_Degradation_Synthesis_for_Generalizable_All-In-One_Image_Restoration_CVPR_2025_paper.html",
      "navigation_group": "papers",
    },
  "scale-wise-var":
    {
      "title": "Scale-Wise VAR",
      "venue": "Accepted to WACV",
      "year": 2027,
      "slides": ["scale-wise-var-1", "scale-wise-var-2", "scale-wise-var-3", "scale-wise-var-4", "scale-wise-var-5"],
      "image_alt": "A Markovian attention mask connects scale-wise visual autoregression with discrete diffusion",
      "description": "A theoretical connection between scale-wise autoregressive generation and discrete diffusion motivates iterative visual refinement.",
      "paper_title": "Scale-Wise VAR is Secretly Discrete Diffusion",
      "contributions":
        [
          "Established an equivalence between scale-wise VAR and discrete diffusion under a Markovian attention mask.",
          "Used the connection to develop Scalable Visual Refinement with Discrete Diffusion (SRDD).",
          "Co-first author with Amandeep Kumar.",
        ],
      "links": [{ "label": "Paper", "url": "https://arxiv.org/abs/2509.22636" }],
      "image": "/assets/img/research-projects/scale-wise-var.webp",
      "pdf": "/assets/slides/scale-wise-var.pdf",
      "definition_title": "Scale-wise generation as discrete diffusion",
      "definition": "Scale-wise VAR generates visual tokens from coarse scales to finer scales. This work shows that, under a Markovian attention mask, its generation process is mathematically equivalent to a discrete diffusion process.",
      "definition_context": "The attention-mask condition is central to the equivalence. It provides a principled way to connect autoregressive token prediction with diffusion-style refinement.",
      "method_steps":
        [
          "Express next-scale prediction as a transition between discrete visual-token representations.",
          "Apply the Markovian attention mask and relate the resulting transitions and training objective to discrete diffusion.",
          "Use this interpretation in Scalable Visual Refinement with Discrete Diffusion (SRDD) to bring iterative refinement into the scale-wise generation framework.",
        ],
      "results":
        [
          "In the 200-epoch study, SRDD reduces MiniImageNet FID from 21.01 to 16.76, a 20.2% relative reduction. FID also decreases on SUN (15.72 to 13.26), FFHQ (19.23 to 17.37) and AFHQ (14.74 to 13.14). Lower FID is better (Table 1).",
          "MiniImageNet and SUN use conditional generation; FFHQ and AFHQ use unconditional generation. The reconstruction examples separately illustrate zero-shot inpainting, outpainting and super-resolution. These results are from the 2025 preprint.",
        ],
      "source_url": "https://arxiv.org/abs/2509.22636",
      "navigation_group": "papers",
    },
