kumar2025scale:
  project: scale-wise-var
  poster: /assets/img/publication_preview/home/scale-wise-var.webp
  alt: Three stages of the same robin show how coarse shapes gain feather detail as generation progresses.
  summary: Predicting visual tokens from coarse to fine connects autoregressive image generation to discrete diffusion.
nair2025scaling:
  project: novel-view-synthesis
  poster: /assets/img/publication_preview/home/novel-view-synthesis.webp
  alt: A synthesized view of a glass-fronted building beside sunlit trees.
  summary: Separating input views from target queries helps a transformer learn new viewpoints from synthetic training images.
rajagopalan2025gendeg:
  project: gendeg
  poster: /assets/img/publication_preview/home/gendeg.webp
  alt: A rock arch before and after restoration by a model trained with GenDeg data.
  summary: GenDeg creates more than 550,000 clean and degraded image pairs to train restoration models for unfamiliar conditions.
nair2025maxfusion:
  project: maxfusion
  poster: /assets/img/publication_preview/home/maxfusion.webp
  alt: A depth map and an edge map beside a robot portrait generated from those controls.
  summary: MaxFusion combines spatial controls such as depth, edges and pose inside a pretrained text-to-image diffusion model.
ranasinghe2024diffuse:
  project: crowddiff
  poster: /assets/img/publication_preview/home/crowddiff.webp
  alt: Green dots mark people that CrowdDiff locates in an outdoor audience.
  summary: CrowdDiff combines multiple diffusion-generated density maps to locate individuals and count people in crowded scenes.
Nair_2023_ICCV:
  project: steered-diffusion
  poster: /assets/img/publication_preview/home/steered-diffusion.webp
  alt: A grayscale photograph of a dog beside a colorization generated by Steered Diffusion.
  summary: Steering an unconditional diffusion model during sampling enables tasks including colorization, inpainting and super-resolution.
nair2023unite:
  project: unite-and-conquer
  poster: /assets/img/publication_preview/home/unite-and-conquer.webp
  alt: A white-on-black face sketch beside a generated portrait of a brown-haired man in the same pose.
  summary: Diffusion models trained on separate conditions can combine sketches, semantic maps and text when generating an image.
