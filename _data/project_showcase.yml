      "outcome_detail": "Generate paired training images with different types and strengths of degradation, then use them to help restoration models handle unfamiliar conditions.",
      "evidence_intro": "Training the same restoration model with GenDS improves several out-of-distribution results. LPIPS and FID measure different aspects of visual quality; lower is better for both.",
      "method_details":
        [
          {
            "title": "Controllable paired data",
            "body": "GenDeg conditions a diffusion generator on a clean image, text and degradation statistics. It generated more than 550,000 paired examples across haze, rain, snow, motion blur, low light and raindrops, with control over degradation type and intensity.",
          },
          {
            "title": "From synthesis to restoration",
            "body": "Structure correction and intensity filtering retain suitable synthetic pairs. Combining these pairs with existing datasets forms GenDS, with more than 750,000 samples, for training all-in-one restoration models. The comparisons test the effect of this training data using the same restoration architecture.",
          },
        ],
      "method_figures":
        [
          {
            "label": "Degradation synthesis and restoration",
            "src": "/assets/img/showcase/gendeg-method-complete.webp",
            "preview": "/assets/img/showcase/gendeg-method-complete-preview.webp",
            "caption": "Train the degradation generator, generate and filter synthetic pairs, then train the restoration model.",
            "alt": "Complete framework: (a) train the conditional degradation generator; (b) generate degraded pairs, correct structure and filter by intensity; (c) train the restoration model. The conditioning and operator legends are retained.",
          },
