  "novel-view-synthesis":
    {
      "headline": "Scale 3D learning with generated views.",
      "pitch": "Token disentanglement helps view-synthesis transformers learn from diffusion-generated observations while reducing their sensitivity to synthetic artifacts.",
      "theme": "Training at scale",
      "metric": "+1.64 dB",
      "metric_label": "PSNR on DL3DV",
      "context": "Tok-D 21.55 vs LVSM 19.91 dB. Real-data training, 256 × 256 evaluation.",
      "caveat": "The headline result tests the architecture with real-data training. Synthetic augmentation is a separate experiment with smaller cross-dataset gains. LVSM values come from its original paper.",
      "role": "Co-first author",
      "problem": "Training views are scarce, but generated views can contain artifacts. A transformer can carry those artifacts into its target predictions when it treats source observations and target queries alike.",
      "idea": "Separate the source and target token representations. This lets the model use synthetic observations while reducing the feature alignment that can propagate their errors.",
      "media":
        [
          {
            "label": "Published examples",
            "src": "/assets/img/showcase/novel-view-synthesis-1.webp",
            "caption": "Cross-dataset reconstruction examples. Original method and ground-truth labels are retained.",
