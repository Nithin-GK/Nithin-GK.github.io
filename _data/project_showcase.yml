  "maxfusion":
    {
      "headline": "Make multiple controls work together.",
      "pitch": "Variance-guided feature fusion combines off-the-shelf diffusion controllers for complementary and conflicting spatial conditions without retraining.",
      "theme": "Control and composition",
      "metric": "46.72",
      "metric_label": "FID with pose + segmentation",
      "context": "T2I-Adapter: 55.61. ControlNet: 63.46. Constructed COCO evaluation, 2,000 images.",
      "caveat": "Lower FID does not imply better adherence on every conditioning metric. Pose-plus-depth MSE-D is worse than ControlNet in the reported comparison.",
      "role": "First author",
      "problem": "Several spatial controls can describe different parts of a scene, or disagree at the same location. Naively combining controllers can discard important details or weaken one condition.",
      "idea": "Use spatial feature variance as a signal of conditioning intensity. Fuse aligned intermediate features so pretrained controllers can contribute where they carry useful information.",
