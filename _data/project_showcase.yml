      "metric": "+5.48 dB",
      "metric_label": "8× super-resolution PSNR",
      "context": "CelebA: 20.54 dB with ILVR, 26.02 dB with Steered Diffusion. 300 evaluation images.",
      "caveat": "Each task has its own metric and protocol. The displayed super-resolution improvement is specific to the paper’s CelebA evaluation.",
      "role": "First author",
      "problem": "Conditional generation often requires a dedicated model for each task. A strong unconditional diffusion generator already contains useful image knowledge, but needs a way to follow new constraints.",
