  "unite-and-conquer":
    {
      "headline": "Independent models. One composed generation.",
      "pitch": "A generalized product of experts brings class- and text-conditioned diffusion models into a shared sampler without joint multimodal training.",
      "theme": "Control and composition",
      "metric": "87.0%",
      "metric_label": "class accuracy",
      "context": "500 generated images. Best of three reliability settings. Class-and-text conditioning.",
      "caveat": "The proposed sampler receives class and text conditions; the displayed baselines use text conditioning. GLIDE retains the highest CLIP score in this comparison.",
      "role": "First author",
      "problem": "A model trained for one condition does not automatically understand another. Joint multimodal training needs paired data across the conditions and repeated training for new combinations.",
      "idea": "Compose independently trained conditional diffusion models at inference time. Reliability weights balance their shared unconditional estimate, while guidance strengths control the individual conditions.",
