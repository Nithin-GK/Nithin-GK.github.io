          },
        ],
      "industry_image": "/assets/img/showcase/novel-view-synthesis-2-preview.webp",
    },
  "gendeg":
    {
      "headline": "Synthetic training data for image restoration.",
      "pitch": "A diffusion model creates degraded versions of clean images, giving restoration models more varied examples to learn from.",
      "theme": "Training at scale",
      "metric": "550K+",
      "metric_label": "synthetic image pairs",
      "context": "Six degradation types. More than 750K samples in the combined GenDS dataset.",
      "caveat": "Benefits vary by degradation. On GoPro, motion-blur LPIPS improves while FID worsens. The evidence compares the same Swin architecture with different training data.",
      "role": "Co-author",
      "problem": "Restoration models see limited scenes and degradation patterns during training. Collecting paired clean and degraded photographs at scale is difficult, leaving a gap when the model meets new conditions.",
      "idea": "Train a diffusion model to generate degraded observations from clean images, with control over degradation type and intensity. Use the resulting pairs to expand restoration training.",
      "media":
        [
          {
            "label": "Restoration with synthetic training data",
