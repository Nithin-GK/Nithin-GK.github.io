  "scale-wise-var":
    {
      "headline": "Connect visual autoregression and diffusion.",
      "pitch": "Show how a particular scale-by-scale image generator can behave like a diffusion model, allowing it to refine its predictions.",
      "theme": "Training at scale",
      "metric": "20.2%",
      "metric_label": "lower MiniImageNet FID",
      "context": "VAR: 21.01. SRDD: 16.76. Matching 200-epoch training study.",
      "caveat": "The equivalence requires a Markovian attention mask. These results are from the 2025 preprint, and MiniImageNet is a reduced benchmark.",
      "role": "Co-first author",
      "problem": "Scale-wise autoregressive generation attends to a history of earlier scales. That history can introduce redundancy, while diffusion methods offer useful ways to refine an imperfect prediction.",
      "idea": "Apply a Markovian attention mask that conditions each scale on its immediate predecessor. The resulting discrete-diffusion interpretation motivates resampling and refinement.",
      "media":
        [
          {
            "label": "Generated images",
            "src": "/assets/img/showcase/scale-wise-var-1.webp",
            "alt": "Published VAR and SRDD image-generation comparison.",
            "caption": "Published VAR and SRDD image-generation comparison.",
            "featured": true,
          },
