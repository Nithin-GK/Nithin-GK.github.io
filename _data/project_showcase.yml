      "image": "/assets/img/showcase/unite-curated-lead.webp",
      "evidence":
        {
          "headers": ["Method", "Conditioning", "Class accuracy", "NIQE", "CLIP"],
          "rows":
            [
              ["GLIDE", "Text only", "0.3%", "6.64", "0.317"],
              ["CompGen", "Text composition", "22.4%", "5.71", "0.282"],
              ["Unite and Conquer", "Class and text", "87.0%", "5.34", "0.286"],
            ],
          "source": "CVPR 2023, Unite and Conquer, Table 3",
          "note": "Class accuracy and CLIP: higher is better. NIQE: lower is better.",
        },
      "outcome": "Compose separately learned conditions",
      "outcome_detail": "Use compatible conditional models across datasets and input representations, without jointly training every modality combination.",
      "evidence_intro": "The paper evaluates class-and-text scenes and semantic face generation. The scene comparison uses 500 generated images and reports the best result over reliability settings of 0, 0.5 and 1.",
      "method_figures":
        [
          {
            "label": "Condition combinations",
            "src": "/assets/img/showcase/unite-method-complete.webp",
            "preview": "/assets/img/showcase/unite-method-complete-preview.webp",
            "caption": "Figure 3. Separate conditional models, or one model trained on individual conditions, can generate from different combinations at sampling time.",
            "alt": "Complete Figure 3 and original caption. Individual conditions can be learned by separate models or by one model trained on one condition at a time; the sampler then composes the requested conditions.",
          },
        ],
      "method_details":
        [
          {
            "title": "Conditions with different representations",
            "body": "The paper combines class labels with language for generic scenes, and face/hair semantic maps, sketches and textual attributes for faces. Each conditional model translates its own input representation into a prediction in a common image-generation space.",
          },
          {
            "title": "Two ways to train",
            "body": "Use separately trained conditional models, including compatible off-the-shelf models, or train one model by alternating individual conditions across batches. Both routes avoid requiring every training image to have all modalities labeled together. A new condition still needs a suitable conditional model.",
          },
          {
            "title": "Learning across datasets",
            "body": "The face experiments use hair labels from CelebA-HQ and skin labels from FFHQ, with 27,000 training images from each. At evaluation, desired face and hair conditions are taken from the same held-out image. The generic-scene experiments compose an ImageNet class model with a text-conditioned model.",
          },
          {
            "title": "Reliability and guidance",
            "body": "Reliability weights combine the models’ null-condition predictions into the shared unconditional estimate. Guidance strengths separately control how strongly the requested class, text or other condition affects the sample. They are different controls, as Figures 6 and 7 show.",
          },
          {
            "title": "Compatible models",
            "body": "The participating models must predict compatible dimensions and channels. The main derivation also assumes a shared variance schedule. The paper could not use Stable Diffusion because its latent dimensions differed. Contradictory conditions and large differences in model capabilities can make composition difficult.",
          },
        ],
      "composition_equations": true,
      "additional_evidence":
        [
          {
            "title": "Semantic face generation",
