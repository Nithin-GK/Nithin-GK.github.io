      "metric_label": "class accuracy",
      "context": "500 generated images. Best of three reliability settings. Class-and-text conditioning.",
      "caveat": "The scene sampler receives class and text conditions, while its displayed baselines use text conditioning. GLIDE has the highest CLIP score. In the face comparison, FID and semantic adherence improve, while LPIPS and SSIM do not improve over every baseline.",
      "role": "First author",
      "problem": "Training a model for every combination of conditions requires jointly labeled data. A model that handles one condition also needs a sampling strategy that can satisfy several conditions together.",
      "idea": "Learn individual conditions separately, using independent models or one model trained on alternating conditions. Compose their predictions during sampling, with separate controls for the shared unconditional estimate and the influence of each requested condition.",
