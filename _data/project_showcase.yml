  "novel-view-synthesis":
    {
      "headline": "Large-scale 3D training with synthetic data.",
      "pitch": "Training large vision transformers to create new views of a scene, using generated examples to expand the available training data.",
      "theme": "Training at scale",
      "metric": "+1.64 dB",
      "metric_label": "PSNR on DL3DV",
      "context": "Tok-D 21.55 vs LVSM 19.91 dB. Real-data training, 256 × 256 evaluation.",
      "caveat": "This table compares the architectures after training on real images. The paper tests synthetic training data separately and finds smaller gains on unseen datasets. LVSM values come from its original paper.",
      "role": "Co-first author",
      "problem": "Large 3D models need many views of many scenes. Generating those views can expand the training data, but the generated images often contain visual errors that the model can learn to repeat.",
      "idea": "Give the input views and output queries separate representations. This helps the transformer use generated training views while reducing the errors that pass into its reconstructed scene.",
      "media":
        [
          {
            "label": "Novel-view reconstruction",
            "src": "/assets/img/showcase/novel-view-synthesis-feature.webp",
            "alt": "Tok-D reconstructs a new view from observations of the same scene.",
            "caption": "Tok-D reconstructs a new view from observations of the same scene.",
            "featured": true,
          },
          {
            "label": "Published reconstruction comparison",
            "src": "/assets/img/showcase/novel-view-synthesis-lead.webp",
            "alt": "Input views, LVSM, Tok-D and ground truth for the red-car scene.",
            "caption": "Input views, LVSM, Tok-D and ground truth for the red-car scene.",
            "wide": true,
            "columns": ["Input views", "LVSM", "Tok-D", "Ground truth"],
            "column_widths": ["0.52fr", "1fr", "1fr", "1fr"],
          },
        ],
      "image": "/assets/img/showcase/novel-view-synthesis-feature-preview.webp",
      "evidence":
        {
          "headers": ["Dataset", "LVSM PSNR", "Tok-D PSNR"],
          "rows": [["RealEstate10K", "28.89 dB", "30.02 dB"], ["ACID", "29.19 dB", "29.47 dB"], ["DL3DV", "19.91 dB", "21.55 dB"]],
          "source": "ICCV 2025, Table 1. Real-data training, 256 × 256.",
          "note": "Higher PSNR is better. LVSM values are taken from its original paper.",
        },
      "outcome": "Learn from generated views",
      "outcome_detail": "Diffusion-generated images provide more training examples. Token disentanglement helps the model learn from them while reducing the visual errors that carry into the reconstructed scene.",
      "evidence_intro": "This table compares reconstruction quality after training on real data, evaluated at 256 × 256 resolution. PSNR measures image fidelity, with higher values indicating closer agreement with the reference image. Synthetic-data augmentation is a separate experiment in the paper.",
      "method_details":
        [
          {
            "title": "Training with generated views",
            "body": "CAT3D generates additional camera-conditioned observations. Tok-D separates source-image tokens from target-view tokens through layer-wise modulation, reducing the effect of artifacts in generated views on reconstruction.",
          },
          {
            "title": "Training and evaluation",
            "body": "The paper reports training on eight H100 GPUs for 100,000 iterations. Its real-data architecture comparison and synthetic-augmentation experiment are separate: the +1.64 dB DL3DV result is from the real-data comparison, while generated views produce smaller cross-dataset gains.",
          },
        ],
      "method_figures":
        [
